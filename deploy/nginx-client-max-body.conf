# Fix HTTP 413 "Request Entity Too Large" for POST /api/media (multipart uploads).
# Install on the Ubuntu host that serves https://www.silvermaidsdubai.com :
#
#   sudo nano /etc/nginx/sites-available/silvermaidsdubai.com
#
# Inside the same `server { ... }` block that proxies to Node/Next, add ONE of:
#
# Option A — raise limit for the whole site:
#   client_max_body_size 32m;
#
# Option B — only for media API (adjust path if your location differs):
#   location /api/media {
#       client_max_body_size 32m;
#       proxy_pass http://127.0.0.1:3000;   # or your upstream
#       ...
#   }
#
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Default nginx `client_max_body_size` is 1m; ~1.2MB files fail with 413.
